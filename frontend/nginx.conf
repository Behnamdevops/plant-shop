# Production nginx config for the Plant Shop frontend.
#
# - Serves the Vite build output as static files.
# - Proxies /api/* to the backend service by Docker service name, so the
#   browser only ever talks to this same origin. This keeps cookies
#   same-site and avoids needing CORS configuration on the backend.
# - Falls back to index.html for unknown paths so client-side routing
#   (react-router) works on full page loads / refreshes.
#
# TLS terminates OUTSIDE this container (at an outer reverse proxy or
# hosting platform). This nginx only ever serves plain HTTP, so:
#   - No HSTS here. Configure Strict-Transport-Security on the
#     TLS-terminating layer instead.
#   - X-Forwarded-Proto is set from the plain-HTTP $scheme and the
#     backend must not trust it for security decisions.

# Rate-limit zones (per client IP). The backend applies its own limits to
# the same sensitive endpoints and returns 429; these nginx zones provide
# an outer layer of protection. Product browsing uses the generous
# api_default zone so normal customers are never throttled.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api_default:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    # ---- Security headers ---------------------------------------------
    # CSP is deliberately conservative so it cannot break the React/Vite
    # app, product images, or the ZarinPal redirect flow:
    #   - Vite emits same-origin /assets/* script/style files.
    #   - Vite injects some inline styles, so style-src allows them.
    #   - Product images are served from this origin or inline SVGs.
    #   - ZarinPal is reached via a full-page redirect (not an iframe),
    #     so form-action is allowed and frame-ancestors 'none' is safe.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self' https://sandbox.zarinpal.com https://payment.zarinpal.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # ---- Sensitive API endpoints: tighter nginx + backend limits -------
    location = /api/v1/auth/login {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/register {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/orders/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- All other API traffic -----------------------------------------
    location /api/ {
        limit_req zone=api_default burst=40 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Health endpoints ----------------------------------------------
    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://backend:8080/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- SPA ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
