# Production nginx config for the Plant Shop frontend.
#
# - Serves the Vite build output as static files.
# - Proxies /api/* to the backend service by Docker service name (set via
#   the BACKEND_HOST/BACKEND_PORT-equivalent below), so the browser only
#   ever talks to this same origin. This keeps cookies same-site and avoids
#   needing CORS configuration on the backend.
# - Falls back to index.html for unknown paths so client-side routing
#   (react-router) works on full page loads / refreshes.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
