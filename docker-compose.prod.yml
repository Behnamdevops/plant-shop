# Production compose stack: postgres + backend + frontend.
#
# The frontend (nginx) is the only service exposed to the host — it serves
# the built SPA and reverse-proxies /api/* to the backend by Docker service
# name, so the browser only ever talks to one origin. Postgres and the
# backend communicate over the internal compose network only.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Required env vars (put them in a local, untracked .env.prod file — see
# .env.prod.example): POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB.
#
# This does not replace docker-compose.yml, which remains the lightweight
# postgres-only stack used for local development.
#
# Uses its own compose project name and volume so it never shares state
# with the dev-only docker-compose.yml stack (which also runs a postgres
# container from the same directory) — otherwise both would resolve to the
# same default "postgres_data" volume and one could initialize the Postgres
# data directory with credentials the other doesn't expect.
name: plantshop-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # No host port mapping: only reachable from other containers on this
    # compose network. Expose "5432:5432" here only if you need direct host
    # access (e.g. for psql/migrations) and understand the security tradeoff.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_ENV: production
      TRUSTED_PROXY_HOST: frontend
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      PUBLIC_BASE_URL: ${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL}
      SHIPPING_STANDARD_RIAL: ${SHIPPING_STANDARD_RIAL:?Set shipping fee}
      SHIPPING_EXPRESS_RIAL: ${SHIPPING_EXPRESS_RIAL:?Set shipping fee}
      FREE_SHIPPING_THRESHOLD_RIAL: ${FREE_SHIPPING_THRESHOLD_RIAL:-0}
      ORDER_RESERVATION_TTL_MINUTES: ${ORDER_RESERVATION_TTL_MINUTES:-30}
      PORT: 8080
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-}
      ZARINPAL_ENABLED: ${ZARINPAL_ENABLED:-false}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-}
      ZARINPAL_LIVE_ENABLED: ${ZARINPAL_LIVE_ENABLED:-false}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Plant Shop}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      # Admin-uploaded product images. Backed by a dedicated named volume
      # (never the postgres volume) so uploads survive container
      # recreation/redeploys. Back this volume up separately from the
      # database if uploaded images must be preserved across host loss —
      # see OPERATIONS.md.
      - uploads_data:/app/data/uploads
      # Article cover images
      - article_uploads_data:/app/data/uploads/articles
    healthcheck:
      # /healthz is the cheap liveness probe; /readyz additionally verifies
      # database connectivity with a short timeout. Use /readyz here so a
      # broken database fails the container healthcheck.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # Not published to the host. The frontend nginx proxy is the only
    # public entry point; reach the backend directly only for debugging via
    # `docker compose exec` or a temporary port mapping.

  storefront:
    build:
      context: ./frontend
      args:
        VITE_STORE_NAME: ${VITE_STORE_NAME:-گلفروشی}
        VITE_PUBLIC_BASE_URL: ${FRONTEND_BASE_URL}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        VITE_SUPPORT_PHONE: ${VITE_SUPPORT_PHONE:-}
        VITE_SUPPORT_TELEGRAM: ${VITE_SUPPORT_TELEGRAM:-}
        VITE_SUPPORT_INSTAGRAM: ${VITE_SUPPORT_INSTAGRAM:-}
    restart: unless-stopped
    environment:
      API_ORIGIN: http://backend:8080
      PUBLIC_BASE_URL: ${FRONTEND_BASE_URL}
      STORE_NAME: ${VITE_STORE_NAME:-گلفروشی}
      PORT: 4173
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:1.28-alpine
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      storefront:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
    name: plantshop_prod_postgres_data
  uploads_data:
    name: plantshop_prod_uploads_data
  article_uploads_data:
    name: plantshop_prod_article_uploads_data
